/* ---------- CLOUD (Supabase): guest/account, cloud save, leaderboards, challenges ---------- */
const SB={url:'https://ttnbrbynqymaekypjxwe.supabase.co',key:'sb_publishable_6HnJ7Ul_tRVppMbt5fXyAQ_5vAVaRJn'};
const CLs={tok:'',rt:'',exp:0,uid:'',email:'',anon:true,name:'',msg:'',board:null,bLv:0,bState:'',pushT:0,booted:0};
try{Object.assign(CLs,JSON.parse(localStorage.getItem('splat_auth')||'{}'))}catch(e){}
function clStore(){try{localStorage.setItem('splat_auth',JSON.stringify({tok:CLs.tok,rt:CLs.rt,exp:CLs.exp,uid:CLs.uid,email:CLs.email,anon:CLs.anon,name:CLs.name}))}catch(e){}}
async function clReq(path,o={},auth=true){const c=new AbortController(),tm=setTimeout(()=>c.abort(),10000);try{const h=Object.assign({apikey:SB.key,'Content-Type':'application/json'},o.headers||{});if(auth&&CLs.tok)h.Authorization='Bearer '+CLs.tok;const r=await fetch(SB.url+path,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined,signal:c.signal}),tx=await r.text();let j=null;try{j=tx?JSON.parse(tx):null}catch(e){}if(!r.ok)throw Object.assign(new Error((j&&(j.msg||j.message||j.error_description||j.error))||('HTTP '+r.status)),{status:r.status});return j}finally{clearTimeout(tm)}}
function clSession(j){if(!j||!j.access_token)return false;CLs.tok=j.access_token;CLs.rt=j.refresh_token||CLs.rt;CLs.exp=j.expires_at||(Date.now()/1000+(j.expires_in||3600));if(j.user){CLs.uid=j.user.id;CLs.email=j.user.email||'';CLs.anon=!j.user.email}clStore();return true}
async function clEnsure(){if(CLs.tok&&CLs.exp>Date.now()/1000+60)return true;if(CLs.rt){try{if(clSession(await clReq('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:CLs.rt}},false)))return true}catch(e){if(e.status>=400&&e.status<500){CLs.tok=CLs.rt='';CLs.exp=0;CLs.booted=0}else throw e}}
if(!clSession(await clReq('/auth/v1/signup',{method:'POST',body:{}},false)))return false;CLs.name='';CLs.booted=0;return true}
async function clProfile(){const r=await clReq('/rest/v1/profiles?id=eq.'+CLs.uid+'&select=name');if(r&&r[0])CLs.name=r[0].name;else CLs.name=await clReq('/rest/v1/rpc/set_name',{method:'POST',body:{p_name:'Guest'+(1000+Math.random()*9000|0)}});clStore()}
function svMergeIn(c){c=svClean(c);SV.unl=Math.max(SV.unl,c.unl);const m=(a,b)=>{const r=[],n=Math.max(a.length,b.length);for(let i=0;i<n;i++)r[i]=Math.max(a[i]||0,b[i]||0);return r};SV.st=m(SV.st,c.st);SV.hs=m(SV.hs,c.hs);SV.coins=Math.max(SV.coins,c.coins);SV.own=SV.own.map((v,i)=>v||c.own[i]?1:0);if(!SV.own[SV.sel])SV.sel=0;try{const j=JSON.stringify(SV);localStorage.setItem('splat_save',j);localStorage.setItem('splat_save_bak',j)}catch(e){}}
async function clSync(){await clEnsure();try{const u=await clReq('/auth/v1/user');if(u&&u.id){CLs.uid=u.id;CLs.email=u.email||'';CLs.anon=!u.email}}catch(e){}await clProfile();const r=await clReq('/rest/v1/saves?user_id=eq.'+CLs.uid+'&select=data');if(r&&r[0]&&r[0].data)svMergeIn(r[0].data);CLs.booted=1;await clPush();clStore()}
async function clBoot(){if(CLs.booted)return;try{await clSync()}catch(e){CLs.booted=0;throw e}}
function clDirty(){if(CLs.tok&&CLs.booted){clearTimeout(CLs.pushT);CLs.pushT=setTimeout(clPush,2500)}}
async function clPush(){try{if(!await clEnsure())return;await clReq('/rest/v1/saves?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:{user_id:CLs.uid,data:SV,updated_at:new Date().toISOString()}})}catch(e){}}
async function clSubmit(l,sc,st){try{await clBoot();await clReq('/rest/v1/rpc/submit_score',{method:'POST',body:{p_level:l,p_score:sc,p_stars:st}});CLs.msg='Score posted to the leaderboard'}catch(e){CLs.msg='Offline - score saved on this device'}}
async function clBoard(l){CLs.bLv=l;CLs.bState='loading';CLs.board=null;try{CLs.board=await clReq('/rest/v1/scores?level=eq.'+(l+1)+'&select=name,score,stars,user_id&order=score.desc&limit=10',{},false)||[];CLs.bState='ok'}catch(e){CLs.bState='err'}}
async function clNameAsk(){const n=prompt('Choose a player name (2-16 letters, numbers or spaces)',CLs.name||'');if(!n)return;CLs.msg='Saving name...';try{await clBoot();CLs.name=await clReq('/rest/v1/rpc/set_name',{method:'POST',body:{p_name:n}});clStore();CLs.msg='Name saved'}catch(e){CLs.msg=/bad name|blocked/i.test(e.message)?'That name is not allowed':'Could not save (offline?)'}}
async function clEmailAsk(){const em=prompt('Enter your email. We will send you a link to sign in.');if(!em||em.indexOf('@')<1)return;const rd=encodeURIComponent(location.origin+location.pathname);CLs.msg='Sending...';try{await clBoot();let linked=false;if(CLs.anon){try{await clReq('/auth/v1/user?redirect_to='+rd,{method:'PUT',body:{email:em.trim()}});linked=true}catch(e){if(e.status!==422&&!/exist|registered/i.test(e.message))throw e}}if(!linked)await clReq('/auth/v1/otp?redirect_to='+rd,{method:'POST',body:{email:em.trim(),create_user:false}},false);CLs.msg='Check your email and tap the link'}catch(e){CLs.msg='Could not send: '+String(e.message||'error').slice(0,40)}}
function clOut(){CLs.tok=CLs.rt=CLs.uid=CLs.email=CLs.name='';CLs.anon=true;CLs.exp=0;CLs.booted=0;clStore();CLs.msg='Signed out (progress stays on this device)'}

(function(){try{const h=location.hash;if(h.indexOf('error_description')>=0){CLs.msg=decodeURIComponent((new URLSearchParams(h.slice(1)).get('error_description')||'').replace(/\+/g,' ')).slice(0,60);history.replaceState(null,'',location.pathname+location.search)}else if(h.indexOf('access_token')>=0){const p=new URLSearchParams(h.slice(1));if(clSession({access_token:p.get('access_token'),refresh_token:p.get('refresh_token'),expires_at:+p.get('expires_at')||0,expires_in:+p.get('expires_in')||3600})){CLs.anon=false;CLs.booted=0;CLs.msg='Signed in!'}history.replaceState(null,'',location.pathname+location.search)}const q=new URLSearchParams(location.search).get('ch');if(q){const a=q.split('.'),lv=(+a[0]||0)-1,sc=+a[1]||0;if(lv>=0&&lv<LV.length&&sc>0)CHal={lv,score:sc,name:decodeURIComponent(a.slice(2).join('.')||'A friend').replace(/[^\w \-]/g,'').slice(0,16)||'A friend'}}}catch(e){}if(CLs.tok)setTimeout(()=>clBoot().catch(()=>{}),800)})();

function toL(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left-ox)/sc,(e.clientY-r.top-oy)/sc]}
cv.addEventListener('pointerdown',e=>{au();if(state!=='play')sfx.click();const[x,y0]=toL(e);aimAt(x,y0);const y=(state==='play'&&!paused)?y0:y0-OY;

if(Math.hypot(x-300,y-BY)<46){swap();return}
for(const[k,bx]of[['bomb',90],['freeze',190],['rain',410]])if(Math.hypot(x-bx,y-BY)<38){usePw(k);return}
if(e.pointerType==='touch')touching=true;else if(e.button===2)swap();else fire()});
